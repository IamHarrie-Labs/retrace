# Fly.io deploy for Retrace. Secrets are set with `fly secrets set`, never in this file.
# The SQLite index lives on a volume: create it once with
#   fly volumes create retrace_data --size 1 --region <region>
app = "retrace"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

# Public IDs, baked into browser code at build time. Not secrets.
[build.args]
  NEXT_PUBLIC_RETRACE_PACKAGE_ID = "0x6bd1fc51b3fac2ab3d890c005e5de49c7574175e5e3f6ecb44e01555712b0c85"
  NEXT_PUBLIC_RETRACE_REGISTRY_ID = "0x8333468c83f45d18ad7676c4fa2aeef79393da9704593967d2744076e2a3494d"
  NEXT_PUBLIC_DEMO_PASSPORT_ID = "0xcf67d39d32099936cf11dd2a756e38513c8d06534467e1281b2878e93b5ebcb3"

[env]
  RETRACE_DATA_DIR = "/app/.data"
  PORT = "3000"

[mounts]
  source = "retrace_data"
  destination = "/app/.data"

[http_service]
  internal_port = 3000
  force_https = true
  # One machine only: SQLite on a volume is single-writer.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/privacy"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
